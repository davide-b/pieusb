[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pieusb"
dynamic = ["version"]
description = "Interface and acquire images from the Reflecta (a.k.a PacificImage) line of film scanners."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "libusb-package>=1.0.30.0",
    "numpy>=1.23.2",
    "pyusb>=1.3.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

# The git tag is the single source of truth for the version.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/pieusb"]

[project.urls]
Homepage = "https://github.com/davide-b/pieusb"
Issues = "https://github.com/davide-b/pieusb/issues"